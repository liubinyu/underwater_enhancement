    indicators:
      mean_brightness:
        direction: low
        mild: 115.0
        moderate: 85.0
        severe: 55.0
        weight: 1.0
      dark_pixel_ratio:
        direction: high
        mild: 0.20
        moderate: 0.40
        severe: 0.65
        weight: 0.9
      extreme_dark_pixel_ratio:
        direction: high
        mild: 0.05
        moderate: 0.18
        severe: 0.40
        weight: 0.7

  low_contrast:
