version: "0.1"
feature_version: "0.1"
threshold_source: initial_heuristics_pending_train_split_review
description: >-
  Initial engineering thresholds for rule smoke tests. They are not physical
  constants or human-verified ground truth and must be reviewed using train-only
  calibration statistics and representative images.

degradations:
  blue_green_color_cast:
    min_indicators: 2
    indicators:
      red_deficit:
        direction: high
        mild: 0.08
        moderate: 0.18
        severe: 0.30
        weight: 1.0
      blue_green_dominance:
        direction: high
        mild: 0.06
        moderate: 0.14
        severe: 0.25
        weight: 0.9
      lab_b_mean:
        direction: low
        mild: -2.0
        moderate: -8.0
        severe: -16.0
        weight: 0.7

  red_color_cast:
    min_indicators: 2
    indicators:
      red_excess:
        direction: high
        mild: 0.08
        moderate: 0.18
        severe: 0.30
        weight: 1.0
      lab_a_mean:
        direction: high
        mild: 4.0
        moderate: 10.0
        severe: 18.0
        weight: 0.8
      red_to_green_ratio:
        direction: high
        mild: 1.10
        moderate: 1.25
        severe: 1.45
        weight: 0.7

  low_light:
