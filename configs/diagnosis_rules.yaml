        direction: high
        mild: 0.38
        moderate: 0.55
        severe: 0.72
        weight: 1.0
      local_contrast_mean:
        direction: low
        mild: 22.0
        moderate: 14.0
        severe: 8.0
        weight: 0.7
      edge_density:
        direction: low
        mild: 0.22
        moderate: 0.13
        severe: 0.07
        weight: 0.6

  over_saturation:
    min_indicators: 2
    indicators:
      hsv_saturation_mean:
        direction: high
        mild: 0.58
        moderate: 0.72
        severe: 0.86
        weight: 0.8
      high_saturation_pixel_ratio:
        direction: high
        mild: 0.22
        moderate: 0.45
        severe: 0.70
        weight: 1.0

