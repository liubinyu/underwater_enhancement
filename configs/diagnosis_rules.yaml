        direction: high
        mild: 0.025
        moderate: 0.050
        severe: 0.090
        weight: 1.0
      high_frequency_energy:
        direction: high
        mild: 0.045
        moderate: 0.085
        severe: 0.140
        weight: 0.7

  possible_detail_loss:
    min_indicators: 2
    indicators:
      laplacian_variance:
        direction: low
        mild: 140.0
        moderate: 65.0
        severe: 28.0
        weight: 0.8
      sobel_gradient_mean:
        direction: low
        mild: 20.0
        moderate: 11.0
        severe: 5.0
        weight: 0.8
      entropy:
        direction: low
        mild: 6.4
        moderate: 5.4
        severe: 4.2
        weight: 0.5

confidence:
  inactive: 0.35
  base_active: 0.55
  agreement_bonus: 0.30
  severity_bonus: 0.15

limitations:
  - 规则结果基于图像统计特征，不等同于人工标注
  - 清晰度低只表示可能模糊或细节不足，不能证明相机失焦
  - haze_proxy是辅助统计量，不能准确测量真实水下后向散射
  - 无法仅根据单张图像准确推断真实水深、水体参数、海域或相机型号
