    indicators:
      gray_std:
        direction: low
        mild: 52.0
        moderate: 38.0
        severe: 24.0
        weight: 1.0
      gray_percentile_range:
        direction: low
        mild: 120.0
        moderate: 85.0
        severe: 50.0
        weight: 0.9
      rms_contrast:
        direction: low
        mild: 0.20
        moderate: 0.14
        severe: 0.09
        weight: 0.7

  blur:
    min_indicators: 2
    indicators:
      laplacian_variance:
        direction: low
        mild: 180.0
        moderate: 90.0
        severe: 40.0
        weight: 1.0
      sobel_gradient_mean:
        direction: low
        mild: 24.0
        moderate: 14.0
        severe: 7.0
